name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Check disk before
        run: |
          df -hT
          df -i

      # 只删无用软件，不重划分区，根分区保持 145G，
      # Docker 与 _diag 共享空间，避免 /pv.img 把根分区占满。
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Restart docker
        run: |
          sudo service docker restart
          for i in {1..10}; do docker info >/dev/null 2>&1 && break; sleep 2; done

      - name: Check disk after
        run: |
          df -hT
          df -i
          docker system df

      - name: Checkout Code
        uses: actions/checkout@v4

      # 删除 Docker Setup Buildx：本 workflow 无 docker buildx build

      - name: Build and push image Aliyun
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

          declare -A duplicate_images
          declare -A temp_map
          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" ]] && continue
              echo "$line" | grep -q '^\s*#' && continue

              image=$(echo "$line" | awk '{print $NF}')
              image="${image%%@*}"
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              name_space="${name_space}_"
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

              if [[ -n "${temp_map[$image_name]}" ]]; then
                  if [[ "${temp_map[$image_name]}" != $name_space ]]; then
                      echo "duplicate image name: $image_name"
                      duplicate_images[$image_name]="true"
                  fi
              else
                  temp_map[$image_name]=$name_space
              fi
          done < images.txt

          if [ ${#duplicate_images[@]} -gt 0 ]; then
              echo "WARNING: duplicate image names across namespaces:"
              for k in "${!duplicate_images[@]}"; do echo "  - $k"; done
          fi

          while IFS= read -r line || [ -n "$line" ]; do
              [[ -z "$line" ]] && continue
              echo "$line" | grep -q '^\s*#' && continue

              echo "docker pull $line"
              docker pull $line

              platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
              if [ -z "$platform" ]; then
                  platform_suffix=""
              else
                  platform_suffix="_${platform//\//_}"
              fi

              image=$(echo "$line" | awk '{print $NF}')
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
              [ -n "$name_space" ] && name_space="${name_space}/"

              image_name_tag="${image_name_tag%%@*}"
              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$name_space$image_name_tag$platform_suffix"

              docker tag "$image" "$new_image"
              docker push "$new_image"

              df -hT
              df -i
              docker rmi "$image" || true
              docker rmi "$new_image" || true
              docker image prune -af >/dev/null 2>&1 || true
              df -hT
              df -i
          done < images.txt

      - name: Cleanup before job end
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true
          sudo rm -rf /home/runner/.cache/* || true
          sudo rm -rf /home/runner/actions-runner/_work/_temp/* || true
          df -hT
          df -i
